<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="112%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <marker id="arrowSlate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a"/>
    </marker>
    <marker id="arrowIndigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#4f46e5"/>
    </marker>
    <linearGradient id="modelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f3ff"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="760" fill="#ffffff"/>

  <!-- Header -->
  <text x="640" y="44" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#0f172a">Support Triage &amp; Model Router — Single-Pass Control Plane</text>
  <text x="640" y="68" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#64748b">7 parallel questions in 1 Gemini Decision 1 pass (~200 ms, 0 output tokens) composed with 4 deterministic Python gates</text>

  <!-- ==================== COLUMN 1: INPUT + GEMINI DECISION 1 ==================== -->

  <!-- Card 1A: Incoming Support Ticket -->
  <g filter="url(#shadow)">
    <rect x="36" y="98" width="336" height="154" rx="16" fill="#f0f6ff" stroke="#93c5fd" stroke-width="1.5"/>
  </g>
  <text x="56" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1" fill="#1d4ed8">1. INCOMING SUPPORT TICKET</text>
  <text x="56" y="144" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#475569">Packed into one shared multimodal input</text>

  <rect x="56" y="158" width="144" height="36" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="128" y="181" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#0f172a">Order Context JSON</text>

  <rect x="208" y="158" width="144" height="36" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="280" y="181" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#0f172a">Customer Message</text>

  <rect x="56" y="202" width="296" height="36" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="204" y="225" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#0f172a">Optional Return Photo (Inline Base64 JPEG)</text>

  <!-- Connector 1A -> 1B -->
  <path d="M 204 252 L 204 288" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowSlate)"/>
  <rect x="134" y="261" width="140" height="20" rx="10" fill="#f1f5f9"/>
  <text x="204" y="275" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" fill="#334155">decisions.create()</text>

  <!-- Card 1B: Gemini Decision 1 (7 Parallel Questions) -->
  <g filter="url(#shadow)">
    <rect x="36" y="296" width="336" height="422" rx="16" fill="url(#modelGrad)" stroke="#a78bfa" stroke-width="1.6"/>
  </g>
  <text x="56" y="324" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1" fill="#5b21b6">2. GEMINI DECISION 1 (SINGLE PASS)</text>
  <text x="56" y="343" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#475569">7 isolated atomic checks · 0 output tokens</text>

  <!-- 7 Question Rows -->
  <!-- Q1 -->
  <rect x="56" y="358" width="296" height="40" rx="9" fill="#ffffff" stroke="#ddd6fe" stroke-width="1"/>
  <rect x="66" y="367" width="52" height="22" rx="11" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="92" y="382" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" fill="#92400e">noul</text>
  <text x="128" y="383" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="600" fill="#1e293b">is_in_scope</text>

  <!-- Q2 -->
  <rect x="56" y="406" width="296" height="40" rx="9" fill="#ffffff" stroke="#ddd6fe" stroke-width="1"/>
  <rect x="66" y="415" width="52" height="22" rx="11" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="92" y="430" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" fill="#92400e">noul</text>
  <text x="128" y="431" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="600" fill="#1e293b">prompt_injection</text>

  <!-- Q3 -->
  <rect x="56" y="454" width="296" height="40" rx="9" fill="#ffffff" stroke="#ddd6fe" stroke-width="1"/>
  <rect x="66" y="463" width="52" height="22" rx="11" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="92" y="478" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" fill="#92400e">noul</text>
  <text x="128" y="479" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="600" fill="#1e293b">claims_damage</text>

  <!-- Q4 -->
  <rect x="56" y="502" width="296" height="40" rx="9" fill="#ffffff" stroke="#ddd6fe" stroke-width="1"/>
  <rect x="66" y="511" width="52" height="22" rx="11" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="92" y="526" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" fill="#92400e">noul</text>
  <text x="128" y="527" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="600" fill="#1e293b">photo_shows_damage</text>

  <!-- Q5 -->
  <rect x="56" y="550" width="296" height="40" rx="9" fill="#ffffff" stroke="#ddd6fe" stroke-width="1"/>
  <rect x="66" y="559" width="52" height="22" rx="11" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="92" y="574" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" fill="#1e40af">choice</text>
  <text x="128" y="575" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="600" fill="#1e293b">workflow (5 queues)</text>

  <!-- Q6 -->
  <rect x="56" y="598" width="296" height="40" rx="9" fill="#ffffff" stroke="#ddd6fe" stroke-width="1"/>
  <rect x="66" y="607" width="52" height="22" rx="11" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="92" y="622" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" fill="#1e40af">choice</text>
  <text x="128" y="623" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="600" fill="#1e293b">reply_model_tier</text>

  <!-- Q7 -->
  <rect x="56" y="646" width="296" height="40" rx="9" fill="#ffffff" stroke="#ddd6fe" stroke-width="1"/>
  <rect x="66" y="655" width="52" height="22" rx="11" fill="#dcfce7" stroke="#22c55e" stroke-width="1"/>
  <text x="92" y="670" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" fill="#166534">score</text>
  <text x="128" y="671" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="600" fill="#1e293b">churn_urgency (0..3)</text>

  <text x="204" y="706" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#5b21b6">Returns calibrated probabilities + confidence</text>

  <!-- Connector from Column 1 to Gate 1 -->
  <path d="M 372 502 L 402 502 L 402 150 L 426 150" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowSlate)"/>
  <text x="392" y="330" text-anchor="middle" transform="rotate(-90 392 330)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="600" fill="#475569">answers + confidence</text>

  <!-- ==================== COLUMN 2: 4 PYTHON GATES ==================== -->

  <!-- Gate 1 -->
  <g filter="url(#shadow)">
    <rect x="434" y="104" width="332" height="92" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
  </g>
  <text x="454" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="0.9" fill="#dc2626">GATE 1 · SECURITY GUARDRAIL</text>
  <text x="454" y="153" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Prompt injection / rule override?</text>
  <text x="454" y="176" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#475569">P(prompt_injection) &gt;= 0.70</text>

  <!-- Gate 1 -> Gate 2 -->
  <path d="M 600 196 L 600 227" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowSlate)"/>
  <text x="610" y="216" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#475569">No (&lt; 0.70)</text>

  <!-- Gate 2 -->
  <g filter="url(#shadow)">
    <rect x="434" y="233" width="332" height="92" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
  </g>
  <text x="454" y="259" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="0.9" fill="#475569">GATE 2 · SCOPE FILTER</text>
  <text x="454" y="282" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Valid order / product support ticket?</text>
  <text x="454" y="305" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#475569">P(is_in_scope) &gt;= 0.50</text>

  <!-- Gate 2 -> Gate 3 -->
  <path d="M 600 325 L 600 356" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowSlate)"/>
  <text x="610" y="345" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#475569">Yes (&gt;= 0.50)</text>

  <!-- Gate 3 -->
  <g filter="url(#shadow)">
    <rect x="434" y="362" width="332" height="92" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
  </g>
  <text x="454" y="388" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="0.9" fill="#d97706">GATE 3 · MULTIMODAL EVIDENCE CHECK</text>
  <text x="454" y="411" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Does photo verify damage claim?</text>
  <text x="454" y="434" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#475569">claims_damage &gt;= 0.75 vs photo_damage</text>

  <!-- Gate 3 -> Gate 4 -->
  <path d="M 600 454 L 600 485" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowSlate)"/>
  <text x="610" y="474" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#475569">Verified / Non-damage</text>

  <!-- Gate 4 -->
  <g filter="url(#shadow)">
    <rect x="434" y="491" width="332" height="92" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
  </g>
  <text x="454" y="517" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="0.9" fill="#16a34a">GATE 4 · CONFIDENCE &amp; POLICY THRESHOLD</text>
  <text x="454" y="540" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Safe for zero-touch automation?</text>
  <text x="454" y="563" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#475569">conf&gt;=0.75 · window_ok · &lt;=$350 · churn&lt;2.5</text>

  <!-- ==================== HORIZONTAL ARROWS TO OUTCOMES ==================== -->

  <!-- Gate 1 -> Outcome 1 -->
  <path d="M 766 150 L 848 150" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="807" y="142" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#dc2626">Yes</text>

  <!-- Gate 2 -> Outcome 2 -->
  <path d="M 766 279 L 848 279" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowSlate)"/>
  <text x="807" y="271" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#475569">No</text>

  <!-- Gate 3 -> Outcome 3 -->
  <path d="M 766 408 L 848 408" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <text x="807" y="400" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#b45309">Mismatch</text>

  <!-- Gate 4 -> Outcome 4 -->
  <path d="M 766 537 L 848 537" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="807" y="529" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#15803d">Yes</text>

  <!-- Gate 4 -> Outcome 5 (Else branch) -->
  <path d="M 600 583 L 600 666 L 848 666" fill="none" stroke="#4f46e5" stroke-width="2" marker-end="url(#arrowIndigo)"/>
  <rect x="616" y="646" width="212" height="22" rx="11" fill="#eef2ff"/>
  <text x="722" y="661" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#4338ca">Else (VIP / &gt; $350 / Low conf)</text>

  <!-- ==================== COLUMN 3: 5 OUTCOME CARDS ==================== -->

  <!-- Outcome 1: BLOCKED -->
  <g filter="url(#shadow)">
    <rect x="856" y="98" width="388" height="104" rx="14" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  </g>
  <rect x="876" y="114" width="108" height="22" rx="11" fill="#dc2626"/>
  <text x="930" y="129" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" fill="#ffffff">BLOCKED [P1]</text>
  <text x="876" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#7f1d1d">Route to Security Audit Queue</text>
  <text x="876" y="180" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#991b1b">reply_model="none" · Zero LLM or payout risk</text>

  <!-- Outcome 2: DEFLECTED -->
  <g filter="url(#shadow)">
    <rect x="856" y="227" width="388" height="104" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  </g>
  <rect x="876" y="243" width="118" height="22" rx="11" fill="#475569"/>
  <text x="935" y="258" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" fill="#ffffff">DEFLECTED [P3]</text>
  <text x="876" y="287" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Send Help-Center Template</text>
  <text x="876" y="309" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#475569">reply_model="template" · $0 generative cost</text>

  <!-- Outcome 3: HUMAN ESCALATION (MISMATCH) -->
  <g filter="url(#shadow)">
    <rect x="856" y="356" width="388" height="104" rx="14" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  </g>
  <rect x="876" y="372" width="154" height="22" rx="11" fill="#d97706"/>
  <text x="953" y="387" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" fill="#ffffff">HUMAN_ESCALATION</text>
  <text x="876" y="416" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#78350f">Claims Specialist / Request Photo</text>
  <text x="876" y="438" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#92400e">Catches intact photo vs. shattered text claim</text>

  <!-- Outcome 4: AUTO EXECUTE -->
  <g filter="url(#shadow)">
    <rect x="856" y="485" width="388" height="104" rx="14" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  </g>
  <rect x="876" y="501" width="126" height="22" rx="11" fill="#16a34a"/>
  <text x="939" y="516" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" fill="#ffffff">AUTO_EXECUTE</text>
  <text x="876" y="545" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#14532d">Trigger Replacement or Refund</text>
  <text x="876" y="567" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#166534">Draft confirmation via gemini_flash_lite</text>

  <!-- Outcome 5: HUMAN ESCALATION (VIP / COMPLEX) -->
  <g filter="url(#shadow)">
    <rect x="856" y="614" width="388" height="104" rx="14" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/>
  </g>
  <rect x="876" y="630" width="188" height="22" rx="11" fill="#4f46e5"/>
  <text x="970" y="645" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" fill="#ffffff">HUMAN_ESCALATION [P1]</text>
  <text x="876" y="674" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#1e1b4b">Specialist Queue + Dynamic Tier</text>
  <text x="876" y="696" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#3730a3">Pre-draft diagnostics via gemini_pro_thinking</text>
</svg>
