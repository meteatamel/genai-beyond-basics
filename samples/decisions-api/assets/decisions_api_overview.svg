  <text x="640" y="48" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#0f172a">Gemini Decisions API — Single-Pass Multimodal Architecture</text>
  <text x="640" y="74" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#64748b">Evaluate 1 to 1,000 isolated typed questions over shared multimodal context with 0 output tokens</text>

