  <rect x="496" y="350" width="212" height="24" rx="12" fill="#ffffff" fill-opacity="0.88" stroke="#c4b5fd" stroke-width="1"/>
  <text x="602" y="366" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#4c1d95">Single Prefill Pass · ~150–250ms</text>

  <rect x="496" y="382" width="212" height="24" rx="12" fill="#ffffff" fill-opacity="0.88" stroke="#c4b5fd" stroke-width="1"/>
  <text x="602" y="398" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#4c1d95">0 Output Tokens · $0.10 / 1M in</text>

