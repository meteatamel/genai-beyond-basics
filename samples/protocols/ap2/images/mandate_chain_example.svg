<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="575" viewBox="0 350 1280 575">
  <defs>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#E37400"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#1A73E8"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-4%" width="104%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="1280" height="1280" fill="#FFFFFF"/>
  <g transform="translate(0, 350)">

    <!-- ================= LEFT PANEL: HUMAN PRESENT ================= -->
    <g transform="translate(20, 20)">
      <rect x="0" y="0" width="355" height="535" rx="20" fill="#F8F9FA" stroke="#DADCE0" stroke-width="2" filter="url(#card-shadow)"/>
      
      <!-- Header -->
      <circle cx="42" cy="40" r="18" fill="#E8F0FE" stroke="#1A73E8" stroke-width="2"/>
      <circle cx="42" cy="34" r="4.5" fill="#1A73E8"/>
      <path d="M34 49 C34 41, 50 41, 50 49" fill="none" stroke="#1A73E8" stroke-width="2.2" stroke-linecap="round"/>
      <text x="70" y="37" font-family="Google Sans, Roboto, Arial, sans-serif" font-size="21" font-weight="700" fill="#202124">Human Present</text>
      <text x="70" y="57" font-family="Google Sans Text, Roboto, Arial, sans-serif" font-size="13.5" fill="#5F6368">1-Step Direct Authorization</text>

      <!-- Closed Mandate Card -->
      <rect x="20" y="80" width="315" height="385" rx="16" fill="#E8F0FE" stroke="#8AB4F8" stroke-width="2"/>
      
      <!-- Card Title -->
      <rect x="36" y="98" width="283" height="52" rx="10" fill="#1A73E8"/>
      <text x="177" y="122" text-anchor="middle" font-family="Google Sans, Roboto, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">Closed Mandate (SD-JWT)</text>
      <text x="177" y="141" text-anchor="middle" font-family="Courier New, monospace" font-size="12" font-weight="700" fill="#D2E3FC">mandate.checkout.1 / payment.1</text>

      <!-- Exact Content Box -->
      <rect x="36" y="164" width="283" height="190" rx="10" fill="#FFFFFF" stroke="#AECBFA" stroke-width="1.5"/>
      <text x="50" y="188" font-family="Google Sans, Roboto, Arial, sans-serif" font-size="14" font-weight="700" fill="#174EA6">Exact Purchase Terms</text>
      <line x1="50" y1="197" x2="305" y2="197" stroke="#E8F0FE" stroke-width="1.5"/>
      <text x="50" y="220" xml:space="preserve" font-family="Courier New, monospace" font-size="13" font-weight="700" fill="#202124">merchant: "RunFast"</text>
      <text x="50" y="244" xml:space="preserve" font-family="Courier New, monospace" font-size="13" font-weight="700" fill="#202124">sku:      "SKU-SHOE-WHITE"</text>
      <text x="50" y="268" xml:space="preserve" font-family="Courier New, monospace" font-size="13" font-weight="700" fill="#202124">amount:   "$120.00"</text>
      <text x="50" y="295" font-family="Google Sans, Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#174EA6">Cross-Mandate Hash Binding</text>
      <text x="50" y="317" font-family="Courier New, monospace" font-size="12" font-weight="700" fill="#1A73E8">checkout_hash: sha256(order)</text>
      <text x="50" y="337" font-family="Courier New, monospace" font-size="12" font-weight="700" fill="#1A73E8">transaction_id == checkout_hash</text>

      <!-- Signature Box -->
      <rect x="36" y="368" width="283" height="78" rx="10" fill="#FFFFFF" stroke="#1A73E8" stroke-width="2"/>
      <text x="50" y="393" font-family="Google Sans, Roboto, Arial, sans-serif" font-size="14" font-weight="700" fill="#174EA6">Cryptographic Signature</text>
      <text x="50" y="416" font-family="Courier New, monospace" font-size="13" font-weight="700" fill="#1E8E3E">✓ Signed by User (user_sk)</text>
      <text x="50" y="435" font-family="Google Sans Text, Roboto, Arial, sans-serif" font-size="12" fill="#5F6368">Confirmed on Trusted Surface</text>

      <!-- Footer -->
      <rect x="20" y="480" width="315" height="38" rx="8" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1.2"/>
      <text x="177" y="504" text-anchor="middle" font-family="Courier New, monospace" font-size="12.5" font-weight="700" fill="#3C4043">Wire: &lt;closed_sd_jwt&gt;~</text>
    </g>

    <!-- ================= RIGHT PANEL: HUMAN NOT PRESENT ================= -->
    <g transform="translate(395, 20)">
      <rect x="0" y="0" width="865" height="535" rx="20" fill="#F8F9FA" stroke="#DADCE0" stroke-width="2" filter="url(#card-shadow)"/>

      <!-- Header -->
      <rect x="24" y="22" width="36" height="36" rx="10" fill="#FEF7E0" stroke="#F29900" stroke-width="2"/>
      <circle cx="42" cy="35" r="4.5" fill="#E37400"/>
      <path d="M33 49 C33 41, 51 41, 51 49" fill="none" stroke="#E37400" stroke-width="2.2" stroke-linecap="round"/>
      <text x="72" y="37" font-family="Google Sans, Roboto, Arial, sans-serif" font-size="21" font-weight="700" fill="#202124">Human Not Present (Autonomous Agent)</text>
      <text x="72" y="57" font-family="Google Sans Text, Roboto, Arial, sans-serif" font-size="13.5" fill="#5F6368">2-Step Cryptographic Delegation Chain (Open Mandate SD-JWT → Closed Mandate KB-SD-JWT)</text>

      <!-- STEP 1: OPEN MANDATE CARD -->
      <rect x="20" y="80" width="340" height="385" rx="16" fill="#FEF7E0" stroke="#FDD663" stroke-width="2"/>
      
      <!-- Step 1 Title -->
      <rect x="36" y="98" width="308" height="52" rx="10" fill="#E37400"/>
      <text x="190" y="122" text-anchor="middle" font-family="Google Sans, Roboto, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">1. Open Mandate (SD-JWT)</text>
      <text x="190" y="141" text-anchor="middle" font-family="Courier New, monospace" font-size="12" font-weight="700" fill="#FEF7E0">mandate.checkout.open.1 / payment.open.1</text>

      <!-- Constraints Box -->
      <rect x="36" y="164" width="308" height="145" rx="10" fill="#FFFFFF" stroke="#FDE293" stroke-width="1.5"/>
      <text x="50" y="187" font-family="Google Sans, Roboto, Arial, sans-serif" font-size="14" font-weight="700" fill="#B06000">Bounded Constraints (Disclosures)</text>
      <line x1="50" y1="196" x2="330" y2="196" stroke="#FEF7E0" stroke-width="1.5"/>
      <text x="50" y="218" xml:space="preserve" font-family="Courier New, monospace" font-size="12.5" font-weight="700" fill="#202124">AllowedMerchants: RunFast, WalkSlow</text>
      <text x="50" y="240" xml:space="preserve" font-family="Courier New, monospace" font-size="12.5" font-weight="700" fill="#202124">AllowedSKUs:      SKU-SHOE-WHITE...</text>
      <text x="50" y="262" xml:space="preserve" font-family="Courier New, monospace" font-size="12.5" font-weight="700" fill="#202124">AmountRange:      max $150.00</text>
      <text x="50" y="284" xml:space="preserve" font-family="Courier New, monospace" font-size="12.5" font-weight="700" fill="#202124">PaymentReference: sha256(open_chk)</text>

      <!-- Key Confirmation (cnf) Box -->
      <rect x="36" y="319" width="308" height="58" rx="10" fill="#FFF8E1" stroke="#F29900" stroke-width="2"/>
      <text x="50" y="341" font-family="Google Sans, Roboto, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#B06000">Holder Key Confirmation (cnf)</text>
      <text x="50" y="363" font-family="Courier New, monospace" font-size="13" font-weight="700" fill="#E37400">cnf: { jwk: agent_pk }</text>

      <!-- User Signature Box -->
      <rect x="36" y="387" width="308" height="62" rx="10" fill="#FFFFFF" stroke="#E37400" stroke-width="2"/>
      <text x="50" y="410" font-family="Google Sans, Roboto, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#B06000">Root Signature</text>
      <text x="50" y="433" font-family="Courier New, monospace" font-size="13" font-weight="700" fill="#1E8E3E">✓ Signed by User (user_sk)</text>

      <!-- ================= CHAIN ARROWS BETWEEN STEP 1 & STEP 2 ================= -->
      <!-- Top Arrow (Forward): 1. Authorizes Key (cnf -> agent_sk) -->
      <path d="M 362 230 L 498 230" fill="none" stroke="#E37400" stroke-width="3" marker-end="url(#arrow-amber)"/>
      <rect x="372" y="172" width="120" height="46" rx="8" fill="#FFF8E1" stroke="#F29900" stroke-width="1.5"/>
      <text x="432" y="191" text-anchor="middle" font-family="Google Sans, Roboto, Arial, sans-serif" font-size="12" font-weight="700" fill="#B06000">1. Authorizes Key</text>
      <text x="432" y="208" text-anchor="middle" font-family="Courier New, monospace" font-size="11.5" font-weight="700" fill="#E37400">cnf → agent_sk</text>

      <!-- Bottom Arrow (Backward): 2. Hash Binds (sd_hash) -->
      <path d="M 500 348 L 366 348" fill="none" stroke="#1A73E8" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arrow-blue)"/>
      <rect x="372" y="290" width="120" height="46" rx="8" fill="#E8F0FE" stroke="#1A73E8" stroke-width="1.5"/>
      <text x="432" y="309" text-anchor="middle" font-family="Google Sans, Roboto, Arial, sans-serif" font-size="12" font-weight="700" fill="#174EA6">2. Hash Binds</text>
      <text x="432" y="326" text-anchor="middle" font-family="Courier New, monospace" font-size="11.5" font-weight="700" fill="#1A73E8">sd_hash(Step 1)</text>

      <!-- STEP 2: CLOSED MANDATE (KB-SD-JWT) CARD -->
      <rect x="505" y="80" width="340" height="385" rx="16" fill="#E8F0FE" stroke="#8AB4F8" stroke-width="2"/>

      <!-- Step 2 Title -->
      <rect x="521" y="98" width="308" height="52" rx="10" fill="#1A73E8"/>
      <text x="675" y="122" text-anchor="middle" font-family="Google Sans, Roboto, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">2. Closed Mandate (KB-SD-JWT)</text>
      <text x="675" y="141" text-anchor="middle" font-family="Courier New, monospace" font-size="12" font-weight="700" fill="#D2E3FC">mandate.checkout.1 / payment.1</text>

      <!-- Final Terms Box -->
      <rect x="521" y="164" width="308" height="145" rx="10" fill="#FFFFFF" stroke="#AECBFA" stroke-width="1.5"/>
      <text x="535" y="187" font-family="Google Sans, Roboto, Arial, sans-serif" font-size="14" font-weight="700" fill="#174EA6">Final Execution (Within Bounds)</text>
      <line x1="535" y1="196" x2="815" y2="196" stroke="#E8F0FE" stroke-width="1.5"/>
      <text x="535" y="218" xml:space="preserve" font-family="Courier New, monospace" font-size="12.5" font-weight="700" fill="#202124">merchant: "RunFast"        ✓</text>
      <text x="535" y="240" xml:space="preserve" font-family="Courier New, monospace" font-size="12.5" font-weight="700" fill="#202124">sku:      "SKU-SHOE-WHITE" ✓</text>
      <text x="535" y="262" xml:space="preserve" font-family="Courier New, monospace" font-size="12.5" font-weight="700" fill="#202124">amount:   "$120.00" (≤150) ✓</text>
      <text x="535" y="284" xml:space="preserve" font-family="Courier New, monospace" font-size="12.5" font-weight="700" fill="#1A73E8">checkout_hash: sha256(order)</text>

      <!-- Chain Binding (sd_hash) Box -->
      <rect x="521" y="319" width="308" height="58" rx="10" fill="#F1F6FE" stroke="#1A73E8" stroke-width="2"/>
      <text x="535" y="341" font-family="Google Sans, Roboto, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#174EA6">Upstream Chain Binding (sd_hash)</text>
      <text x="535" y="363" font-family="Courier New, monospace" font-size="13" font-weight="700" fill="#1A73E8">sd_hash: sha256(open_sd_jwt)</text>

      <!-- Agent Signature Box -->
      <rect x="521" y="387" width="308" height="62" rx="10" fill="#FFFFFF" stroke="#1A73E8" stroke-width="2"/>
      <text x="535" y="410" font-family="Google Sans, Roboto, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#174EA6">Delegated Agent Signature</text>
      <text x="535" y="433" font-family="Courier New, monospace" font-size="13" font-weight="700" fill="#1E8E3E">✓ Signed by Agent (agent_sk)</text>

      <!-- Footer -->
      <rect x="20" y="480" width="825" height="38" rx="8" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1.2"/>
      <text x="432" y="504" text-anchor="middle" font-family="Courier New, monospace" font-size="12.5" font-weight="700" fill="#3C4043">Chained Wire Format: &lt;open_sd_jwt&gt;~~&lt;closed_kb_sd_jwt&gt;~   (Verified deterministically by Merchant &amp; CP/MPP)</text>
    </g>

  </g>
</svg>
